# Databricks Asset Bundle for the SCCM -> Drata device compliance sync.
#
# No Spark distribution -- data movement is via the SQL Statement Execution REST API
# (db/queries.py); the Drata push is driver-side ThreadPoolExecutor I/O (db/drata_client.py).
# Compute is deliberately serverless/single-node -- do not convert to a multi-node cluster.
#
# Serverless python_wheel_task has no environment-variable injection mechanism. Instead,
# extract_devices.py takes a repeatable `--env KEY=VALUE` CLI flag applied to os.environ
# before anything else reads a DATABRICKS_* var (see _apply_cli_env_overrides()). Every
# table/warehouse/secret-scope variable below is passed through that flag.
#
# Auth: OAuth M2M (service principal) preferred over a personal access token, per
# Nationwide security policy. db/auth.py's get_client_for_env() prefers OAuth when a scope
# holds databricks-client-id-{prod,test} + databricks-client-secret-{prod,test}, falling
# back to databricks-token-{prod,test} (PAT) otherwise. One secret scope per workspace.

bundle:
  name: databricks-interface

variables:
  warehouse_id_prod:
    description: SQL warehouse ID in the prod workspace (si_prod_catalog tables)
    default: "487241390a777647"
  warehouse_id_test:
    description: SQL warehouse ID in the test workspace (si_test_catalog tables)
    default: "ed10729e21418123"
  secret_scope_name_prod:
    description: >
      Prod workspace secret scope. Holds databricks-host-prod / databricks-client-id-prod /
      databricks-client-secret-prod (or databricks-token-prod as a PAT fallback).
    default: "dbx_irg_prod_comp_sp"
  secret_scope_name_test:
    description: >
      Test workspace secret scope ("Drata ETL"). Holds databricks-client-id-test /
      databricks-client-secret-test (or databricks-token-test as a PAT fallback).
    default: "dbx_irg_dev_comp_sp"
  secret_scope_default:
    description: >
      Scope for db/secrets.py::get_secret() calls that pass no explicit scope -- currently
      drata-api-key/drata-connection-id (etl/extract_devices.py). Not per-workspace, so it
      doesn't fit the prod/test split above.
    default: "dbx_irg_dev_comp_sp"
  devices_client:
    description: >
      Which workspace connection extract-devices.py uses for the devices table -- "prod"
      (real production data, default) or "test" (a devices-equivalent table in the test
      workspace's catalog, needing zero prod credentials). Overridden to "test" in dev below.
    default: "prod"
  sandbox:
    description: >
      Default for the "sandbox" job parameter. "true" rewrites personnelId to
      @sandbox.nationwide.com before pushing (see etl/extract_devices.py); "false" pushes
      real data. prod's target below overrides this to "false" since the nightly schedule
      triggers with default parameters and can't pass --params per run -- pass
      --params sandbox=true for a sandboxed test run against prod data instead.
    default: "true"
  devices_table:
    description: Fully qualified prod device table (DATABRICKS_TABLE_DEVICES).
    default: "si_prod_catalog.nw_harmonized_sensitive.t_sccm_r_system"
  users_table:
    description: >
      SCCM employee/username bridge table (DATABRICKS_TABLE_USERS) -- bridges iamdb_table's
      employeenumber to the user_name0/windows_nt_domain0 a device carries. Not the
      personnel anchor itself; see iamdb_table.
    default: "si_prod_catalog.nw_harmonized_sensitive.t_sccm_r_user"
  iamdb_table:
    description: >
      Nationwide's authoritative IAM/HR identity table (DATABRICKS_TABLE_IAMDB) -- the
      personnel anchor. Filtered to employeetype='E' AND employeestatus='A'. Joined to
      users_table via employee_number to find active personnel with an SCCM device.
    default: "si_prod_catalog.nw_harmonized_sensitive.t_iamdb_userdata"
  table_windows_update:
    description: >
      Windows Update secondary table (DATABRICKS_TABLE_WINDOWS_UPDATE) -- raw landing
      table, latest-batch filter applied automatically (see _RAW_LANDING_TABLES).
    default: "si_prod_catalog.nw_harmonized_sensitive.t_sccm_gs_windowsupdate"
  table_installed_software:
    description: >
      Installed software secondary table (DATABRICKS_TABLE_INSTALLED_SOFTWARE). Same raw
      landing table pattern as table_windows_update.
    default: "si_prod_catalog.nw_harmonized_sensitive.t_sccm_gs_installed_software"
  table_antivirus:
    description: >
      Antivirus product table, feeds antivirusEnabled (DATABRICKS_TABLE_ANTIVIRUS). Same
      raw landing table pattern.
    default: "si_prod_catalog.nw_harmonized_sensitive.t_sccm_gs_antivirusproduct"
  table_firewall:
    description: >
      Firewall product table, pulled but not yet wired to a Drata field
      (DATABRICKS_TABLE_FIREWALL). Same raw landing table pattern.
    default: "si_prod_catalog.nw_harmonized_sensitive.t_sccm_gs_firewallproduct"
  table_bitlocker:
    description: >
      Encrypted volume table, feeds encryptionEnabled (DATABRICKS_TABLE_BITLOCKER). Same
      raw landing table pattern.
    default: "si_prod_catalog.nw_harmonized_sensitive.t_sccm_gs_encryptable_volume"
  table_computer_system:
    description: >
      Computer system table, feeds hardware model (DATABRICKS_TABLE_COMPUTER_SYSTEM). Same
      raw landing table pattern.
    default: "si_prod_catalog.nw_harmonized_sensitive.t_sccm_gs_computer_system"
  table_screensaver:
    description: >
      Screen lock table, feeds screenLockEnabled (DATABRICKS_TABLE_SCREENSAVER). No table
      is actually named for screensavers -- t_sccm_gs_desktop carries the Control
      Panel\Desktop registry values (screen_saver_active0/secure0/timeout0) instead. Same
      raw landing table pattern; si_prod_catalog existence not independently confirmed for
      this specific table.
    default: "si_prod_catalog.nw_harmonized_sensitive.t_sccm_gs_desktop"

artifacts:
  databricks_interface:
    type: whl
    build: python -m build --wheel
    path: .
    # Bump pyproject.toml's `version` before every deploy that changes the wheel's code or
    # dependencies -- serverless compute caches the built environment by version string and
    # will silently keep running an old wheel otherwise.
    #
    # Do not enable dynamic_version -- databricks/cli#2784 (closed "not planned") can deploy
    # a stale wheel alongside the correctly-versioned one and silently select the stale one.

resources:
  jobs:
    extract_devices_job:
      name: extract_devices_job

      # Quartz cron, seconds-first: every day at midnight local to timezone_id.
      # America/New_York (not a fixed offset) to stay midnight local across EST/EDT.
      schedule:
        quartz_cron_expression: "0 0 0 * * ?"
        timezone_id: "America/New_York"
        pause_status: "UNPAUSED"

      # Table paths, warehouse IDs, and the secret scope NAME (not its contents) are job
      # parameters -- serverless python_wheel_task has no other way to reach the process.
      # Credentials themselves stay in the secret scope, resolved by db/secrets.py at runtime.
      parameters:
        - name: full
          default: "true"
        - name: sandbox
          default: "${var.sandbox}"
        - name: test_mode
          default: "false"
        - name: dry_run
          default: "false"
        - name: limit
          default: "1000"
        - name: secret_scope_prod
          default: "${var.secret_scope_name_prod}"
        - name: secret_scope_test
          default: "${var.secret_scope_name_test}"
        - name: secret_scope_default
          default: "${var.secret_scope_default}"
        - name: devices_client
          default: "${var.devices_client}"
        - name: warehouse_prod
          default: "${var.warehouse_id_prod}"
        - name: warehouse_test
          default: "${var.warehouse_id_test}"
        - name: devices_table
          default: "${var.devices_table}"
        - name: users_table
          default: "${var.users_table}"
        - name: iamdb_table
          default: "${var.iamdb_table}"
        - name: table_windows_update
          default: "${var.table_windows_update}"
        - name: table_installed_software
          default: "${var.table_installed_software}"
        - name: table_antivirus
          default: "${var.table_antivirus}"
        - name: table_firewall
          default: "${var.table_firewall}"
        - name: table_bitlocker
          default: "${var.table_bitlocker}"
        - name: table_computer_system
          default: "${var.table_computer_system}"
        - name: table_screensaver
          default: "${var.table_screensaver}"

      tasks:
        - task_key: extract_devices
          # Serverless SQL warehouse compute can take 24h+ for the full population.
          timeout_seconds: 172800
          # Safe to retry -- Drata upserts on externalId, a retry can't create duplicates.
          max_retries: 1
          email_notifications:
            on_failure:
              - "ITComplianceSupport@nationwide.com"
          webhook_notifications: {}
          notification_settings:
            # Collapses retries into a single alert instead of one per attempt.
            alert_on_last_attempt: true
          python_wheel_task:
            package_name: databricks-interface
            entry_point: extract-devices
            parameters:
              # --env KEY=VALUE is read by _apply_cli_env_overrides() before argparse
              # resolves its defaults -- the only channel into a serverless
              # python_wheel_task's environment.
              - "--env"
              - "DATABRICKS_SECRET_SCOPE_PROD={{job.parameters.secret_scope_prod}}"
              - "--env"
              - "DATABRICKS_SECRET_SCOPE_TEST={{job.parameters.secret_scope_test}}"
              - "--env"
              - "DATABRICKS_SECRET_SCOPE={{job.parameters.secret_scope_default}}"
              - "--devices-client"
              - "{{job.parameters.devices_client}}"
              - "--env"
              - "DATABRICKS_WAREHOUSE_ID={{job.parameters.warehouse_prod}}"
              - "--env"
              - "DATABRICKS_WAREHOUSE_ID_TEST={{job.parameters.warehouse_test}}"
              - "--env"
              - "DATABRICKS_TABLE_DEVICES={{job.parameters.devices_table}}"
              - "--env"
              - "DATABRICKS_TABLE_USERS={{job.parameters.users_table}}"
              - "--env"
              - "DATABRICKS_TABLE_IAMDB={{job.parameters.iamdb_table}}"
              - "--env"
              - "DATABRICKS_TABLE_WINDOWS_UPDATE={{job.parameters.table_windows_update}}"
              - "--env"
              - "DATABRICKS_TABLE_INSTALLED_SOFTWARE={{job.parameters.table_installed_software}}"
              - "--env"
              - "DATABRICKS_TABLE_ANTIVIRUS={{job.parameters.table_antivirus}}"
              - "--env"
              - "DATABRICKS_TABLE_FIREWALL={{job.parameters.table_firewall}}"
              - "--env"
              - "DATABRICKS_TABLE_BITLOCKER={{job.parameters.table_bitlocker}}"
              - "--env"
              - "DATABRICKS_TABLE_COMPUTER_SYSTEM={{job.parameters.table_computer_system}}"
              - "--env"
              - "DATABRICKS_TABLE_SCREENSAVER={{job.parameters.table_screensaver}}"
              - "--limit"
              - "{{job.parameters.limit}}"
              - "--full"
              - "{{job.parameters.full}}"
              - "--sandbox"
              - "{{job.parameters.sandbox}}"
              - "--test-mode"
              - "{{job.parameters.test_mode}}"
              - "--dry-run"
              - "{{job.parameters.dry_run}}"
          environment_key: default_env

      environments:
        - environment_key: default_env
          spec:
            client: "1"
            dependencies:
              - ./dist/*.whl
              # Vendored wheels (see vendor/README.md) -- avoids needing PyPI reachability
              # from serverless compute.
              - ./vendor/*.whl

    smoke_test_job:
      name: smoke_test_job
      # Zero-dependency platform-isolation test -- isolates workspace/platform failures
      # from this project's own code (see smoke_test.py).
      tasks:
        - task_key: smoke_test
          spark_python_task:
            python_file: ./smoke_test.py
          environment_key: smoke_test_env

      environments:
        - environment_key: smoke_test_env
          spec:
            client: "1"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://nationwide-irm-test-ohio.cloud.databricks.com
    variables:
      secret_scope_name_prod: "dbx_irg_prod_comp_sp"
      secret_scope_name_test: "dbx_irg_dev_comp_sp"

  prod:
    mode: production
    workspace:
      host: "https://nationwide-irm-prod-ohio.cloud.databricks.com"
      # Must be under /Shared, not a personal /Workspace/Users/ path -- the run_as service
      # principal has no read access there.
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      # Requires CAN_USE granted on this service principal, separate from its workspace
      # assignment (see README's "Adding the job's service principal" section).
      service_principal_name: "8d56d7cd-cbfc-4b91-ad9c-03c7d0973774"
    variables:
      # Prod workspace has no dbx_irg_dev_comp_sp scope -- repoint to the prod scope.
      secret_scope_default: "dbx_irg_prod_comp_sp"
      # Real push -- the nightly schedule relies on this default, it can't pass --params.
      sandbox: "false"
