# Databricks Asset Bundle for the SCCM -> Drata device compliance sync.
#
# This job does NO Spark distribution -- all data movement is via the SQL Statement
# Execution REST API (db/queries.py) and the Drata push is driver-side ThreadPoolExecutor
# I/O (db/drata_client.py). Compute is deliberately serverless/single-node; do not convert
# this to a multi-node job cluster, it would just be idle cost.
#
# `databricks bundle validate` has NOT been run against this file -- the Databricks CLI is
# not available in the environment this was authored in. Run it on a machine with the CLI
# installed before deploying, and expect to fix minor schema issues on the first pass.
#
# RESOLVED (2026-08-04): serverless python_wheel_task has NO environment-variable injection
# mechanism at any level -- confirmed against Databricks' Jobs API docs and the serverless
# compute limitations page, which states outright: "Environment variables. Instead, Databricks
# recommends using widgets to create job and task parameters." spark_env_vars only exists on a
# classic new_cluster spec, which serverless (environment_key/environments.spec) doesn't have.
# So the fix is NOT an env key on environments.spec -- there isn't one. Instead, extract_devices.py
# now takes a repeatable `--env KEY=VALUE` CLI flag (applied to os.environ before anything else
# reads a DATABRICKS_* var, including argparse's own defaults) -- see
# etl/extract_devices.py::_apply_cli_env_overrides(). Every table/warehouse/secret-scope
# variable below is passed through that flag in the task's `parameters` list.
#
# Two placeholders below still block real execution (not deploy) until Nationwide sends the
# actual values: the two per-workspace secret scope names. The job's service-principal identity
# and the prod workspace host separately block only a `prod` target deploy. See README.md's
# "Running on Databricks" section for who owns each.
#
# Auth: Nationwide's security policy prefers OAuth M2M (service principal) over a personal
# access token -- confirmed by Terry Hardaway 2026-07-13. db/auth.py's get_client_for_env()
# prefers OAuth when a scope holds both databricks-client-id-{prod,test} and
# databricks-client-secret-{prod,test}, falling back to databricks-token-{prod,test} (PAT)
# otherwise. Nationwide provisions one secret scope per workspace, not one shared scope.

bundle:
  name: databricks-interface

variables:
  warehouse_id_prod:
    description: SQL warehouse ID in the prod workspace (si_prod_catalog tables)
    default: "487241390a777647"
  warehouse_id_test:
    description: SQL warehouse ID in the test workspace (si_test_catalog tables)
    default: "ed10729e21418123"
  secret_scope_name_prod:
    description: >
      PLACEHOLDER -- Nationwide confirmed this scope was created 2026-07-13 but has not yet
      sent the actual name. Holds databricks-client-id-prod / databricks-client-secret-prod
      (or databricks-token-prod as a PAT fallback) plus DRATA_API_KEY / DRATA_CONNECTION_ID.
      Do not deploy until this is set to the real scope name.
    default: "CHANGE_ME_secret_scope_prod"
  secret_scope_name_test:
    description: >
      Confirmed 2026-08-04 via dbutils.secrets.listScopes() run directly against the test
      workspace (nationwide-irm-test-ohio) -- "Drata ETL" is the scope, named after this
      integration. Holds databricks-client-id-test / databricks-client-secret-test (or
      databricks-token-test as a PAT fallback). Contents not yet verified -- confirm the
      expected keys actually exist (dbutils.secrets.list(scope="dbx_irg_dev_comp_sp")) before
      relying on this for a real run; the scope existing doesn't guarantee it's populated.
    default: "dbx_irg_dev_comp_sp"
  secret_scope_default:
    description: >
      Used for db/secrets.py::get_secret() calls that pass no explicit scope -- currently
      only drata-api-key/drata-connection-id (etl/extract_devices.py). These aren't
      per-workspace, so they don't fit secret_scope_name_prod/_test's split. Same scope as
      secret_scope_name_test above -- Drata credentials were added there directly.
    default: "dbx_irg_dev_comp_sp"
  devices_client:
    description: >
      Which workspace connection extract-devices.py uses for the devices table -- "prod"
      (real production data, default) or "test" (a devices-equivalent table in the test
      workspace's catalog, for an end-to-end test run needing zero prod credentials).
      Overridden to "test" in the dev target below.
    default: "prod"
  # Table paths below are NOT placeholders -- real values from .env.example, confirmed
  # against actual SCCM tables 2026-07-15 ("SCCM Test Tables - Updated 7-15.xlsx"). They were
  # already known; the only bug was that databricks.yml never passed them to the running job.
  devices_table:
    description: Fully qualified prod device table (DATABRICKS_TABLE_DEVICES).
    default: "si_prod_catalog.nw_harmonized_sensitive.t_sccm_v_r_system_temp"
  users_table:
    description: Fully qualified test-workspace user identity table (DATABRICKS_TABLE_USERS).
    default: "si_test_catalog.nw_harmonized_sensitive.t_sccm_r_user"
  table_windows_update:
    description: Windows Update secondary table (DATABRICKS_TABLE_WINDOWS_UPDATE).
    default: "si_test_catalog.nw_harmonized_sensitive.t_sccm_gs_windowsupdate"
  table_installed_software:
    description: Installed software secondary table (DATABRICKS_TABLE_INSTALLED_SOFTWARE).
    default: "si_test_catalog.nw_harmonized_sensitive.t_sccm_gs_installed_software"
  table_antivirus:
    description: Antivirus product table, feeds antivirusEnabled (DATABRICKS_TABLE_ANTIVIRUS).
    default: "si_test_catalog.nw_harmonized_sensitive.t_sccm_gs_antivirusproduct"
  table_firewall:
    description: Firewall product table, pulled but not yet wired to a Drata field (DATABRICKS_TABLE_FIREWALL).
    default: "si_test_catalog.nw_harmonized_sensitive.t_sccm_gs_firewallproduct"
  table_bitlocker:
    description: Encrypted volume table, feeds encryptionEnabled (DATABRICKS_TABLE_BITLOCKER).
    default: "si_test_catalog.nw_harmonized_sensitive.t_sccm_gs_encryptable_volume"
  table_computer_system:
    description: Computer system table, feeds hardware model (DATABRICKS_TABLE_COMPUTER_SYSTEM).
    default: "si_test_catalog.nw_harmonized_sensitive.t_sccm_gs_computer_system"

artifacts:
  databricks_interface:
    type: whl
    build: python -m build --wheel
    path: .
    # IMPORTANT: bump pyproject.toml's `version` before every deploy that changes the wheel's
    # code or dependencies. Serverless compute caches the built environment by dependency
    # spec and will silently keep running an OLD wheel if the version string is unchanged --
    # this caused identical library-install failures to persist across multiple substantive
    # code changes on 2026-07-24/27 before it was diagnosed.
    #
    # dynamic_version: true (which auto-bumps this) was tried and REVERTED 2026-08-04 -- it
    # hits a confirmed, unfixed Databricks CLI bug (databricks/cli#2784, closed "not planned"):
    # combined with a glob-style local path in environments.spec.dependencies (our ./dist/*.whl
    # below), the CLI can deploy two wheels -- one correctly version-patched, one stale -- and
    # silently select the stale one. That is the most likely cause of "Unable to find or
    # download the required package" resurfacing on 2026-08-04 even though vendor/ was intact
    # and correct. Do not re-enable dynamic_version without a documented fix to that issue.

resources:
  jobs:
    extract_devices_job:
      name: extract_devices_job

      # Non-secret config only -- table paths, warehouse IDs, and the secret SCOPE NAME
      # (not its contents) are job parameters here because serverless python_wheel_task has
      # no other way to reach the running process (see the RESOLVED note up top). Actual
      # credentials (host/token/client_id/client_secret) never appear here -- those stay
      # resolved from the secret scope by db/secrets.py at runtime, exactly as before.
      parameters:
        - name: full
          default: "false"
        - name: sandbox
          default: "false"
        - name: test_mode
          default: "false"
        - name: dry_run
          default: "false"
        - name: limit
          default: "1000"
        - name: secret_scope_prod
          default: "${var.secret_scope_name_prod}"
        - name: secret_scope_test
          default: "${var.secret_scope_name_test}"
        - name: secret_scope_default
          default: "${var.secret_scope_default}"
        - name: devices_client
          default: "${var.devices_client}"
        - name: warehouse_prod
          default: "${var.warehouse_id_prod}"
        - name: warehouse_test
          default: "${var.warehouse_id_test}"
        - name: devices_table
          default: "${var.devices_table}"
        - name: users_table
          default: "${var.users_table}"
        - name: table_windows_update
          default: "${var.table_windows_update}"
        - name: table_installed_software
          default: "${var.table_installed_software}"
        - name: table_antivirus
          default: "${var.table_antivirus}"
        - name: table_firewall
          default: "${var.table_firewall}"
        - name: table_bitlocker
          default: "${var.table_bitlocker}"
        - name: table_computer_system
          default: "${var.table_computer_system}"

      tasks:
        - task_key: extract_devices
          # Sized generously above an expected --full run (tens of thousands of users,
          # chunked 500 at a time) with headroom for cold serverless warehouse starts.
          # Adjust once a real --full run's wall-clock time is measured.
          timeout_seconds: 14400
          # Safe because Drata upserts on externalId (see the duplicate-externalId quality
          # gate in etl/extract_devices.py) -- a retried run re-pushes the same data,
          # it does not create duplicates.
          max_retries: 1
          email_notifications:
            on_failure:
              - CHANGE_ME_ops_distribution_list@example.com # PLACEHOLDER -- confirm on-call/ops list
          # Only alert on the final retry attempt, not every one -- avoids spamming the
          # ops list once per attempt when max_retries kicks in.
          webhook_notifications: {}
          notification_settings:
            alert_on_last_attempt: true
          python_wheel_task:
            package_name: databricks-interface
            entry_point: extract-devices
            parameters:
              # --env KEY=VALUE is consumed by _apply_cli_env_overrides() in
              # etl/extract_devices.py before anything else reads a DATABRICKS_* var --
              # this is the only channel into a serverless python_wheel_task's process
              # (see the RESOLVED note up top). Order doesn't matter -- the whole argv is
              # scanned upfront -- but these are listed first for readability.
              - "--env"
              - "DATABRICKS_SECRET_SCOPE_PROD={{job.parameters.secret_scope_prod}}"
              - "--env"
              - "DATABRICKS_SECRET_SCOPE_TEST={{job.parameters.secret_scope_test}}"
              - "--env"
              - "DATABRICKS_SECRET_SCOPE={{job.parameters.secret_scope_default}}"
              - "--devices-client"
              - "{{job.parameters.devices_client}}"
              - "--env"
              - "DATABRICKS_WAREHOUSE_ID={{job.parameters.warehouse_prod}}"
              - "--env"
              - "DATABRICKS_WAREHOUSE_ID_TEST={{job.parameters.warehouse_test}}"
              - "--env"
              - "DATABRICKS_TABLE_DEVICES={{job.parameters.devices_table}}"
              - "--env"
              - "DATABRICKS_TABLE_USERS={{job.parameters.users_table}}"
              - "--env"
              - "DATABRICKS_TABLE_WINDOWS_UPDATE={{job.parameters.table_windows_update}}"
              - "--env"
              - "DATABRICKS_TABLE_INSTALLED_SOFTWARE={{job.parameters.table_installed_software}}"
              - "--env"
              - "DATABRICKS_TABLE_ANTIVIRUS={{job.parameters.table_antivirus}}"
              - "--env"
              - "DATABRICKS_TABLE_FIREWALL={{job.parameters.table_firewall}}"
              - "--env"
              - "DATABRICKS_TABLE_BITLOCKER={{job.parameters.table_bitlocker}}"
              - "--env"
              - "DATABRICKS_TABLE_COMPUTER_SYSTEM={{job.parameters.table_computer_system}}"
              - "--limit"
              - "{{job.parameters.limit}}"
              - "--full"
              - "{{job.parameters.full}}"
              - "--sandbox"
              - "{{job.parameters.sandbox}}"
              - "--test-mode"
              - "{{job.parameters.test_mode}}"
              - "--dry-run"
              - "{{job.parameters.dry_run}}"
          environment_key: default_env

      environments:
        - environment_key: default_env
          spec:
            client: "1"
            dependencies:
              - ./dist/*.whl
              # Vendored third-party dependencies (see vendor/README.md for how these were
              # built and how to refresh them) -- avoids needing PyPI reachability from
              # serverless compute, which is not open by default in this environment.
              - ./vendor/*.whl

    smoke_test_job:
      name: smoke_test_job
      # Zero-dependency platform-isolation test (added 2026-08-04): if this fails with the
      # same "Failed to restart Python" / dbruntime kernel-restart error extract_devices_job
      # has been hitting, that proves the failure is workspace/platform-side, not caused by
      # anything in our own wheel/vendor/dependency tree. No custom package, no vendored
      # wheels, no relationship to this project's code at all -- see smoke_test.py.
      tasks:
        - task_key: smoke_test
          spark_python_task:
            python_file: ./smoke_test.py
          environment_key: smoke_test_env

      environments:
        - environment_key: smoke_test_env
          spec:
            client: "1"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://nationwide-irm-test-ohio.cloud.databricks.com
    variables:
      secret_scope_name_prod: "CHANGE_ME_secret_scope_prod"
      secret_scope_name_test: "dbx_irg_dev_comp_sp"
      # First real end-to-end validation: test data only, zero prod dependency, so this run
      # can prove the pipeline pulls/transforms/pushes to Drata correctly before prod
      # credentials exist at all. Switch devices_client back to "prod" (and drop this
      # devices_table override, falling back to the top-level default) once that's confirmed
      # and it's time to test against the real device inventory.
      devices_client: "test"
      devices_table: "si_test_catalog.nw_harmonized_sensitive.t_sccm_v_r_system_temp"

  prod:
    mode: production
    workspace:
      # PLACEHOLDER -- pending confirmation of the prod deploy target's reachable/authorized
      # workspace host. See README.md's "Prerequisites before deploying to prod".
      host: "CHANGE_ME_prod_workspace_host"
    run_as:
      # PLACEHOLDER -- pending a named owner for this job's service-principal identity. Once
      # named, this is also the OAuth M2M service principal Nationwide provisions per the
      # auth note above.
      service_principal_name: "CHANGE_ME_service_principal"
